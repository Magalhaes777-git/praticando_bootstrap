<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 01 - Cartão de Perfil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark">
    <div class="container mt-5">
        <div class="card mx-auto shadow-sm text-white" style="max-width: 400px; background-color: rgb(87, 84, 84)">
            <div class="card-body text-center p-4">
                <img src="https://static.wikia.nocookie.net/gtawiki/images/1/17/CalHampton-GTAVye.png/revision/latest?cb=20261120113744"
                    class="rounded-circle mb-3 border border-3 border-dark" style="max-width: 120px;">
                <h3 class="card-title fw-bold text-center text-white">Cal Great Thief Andy</h3>
                <p class="text-muted mb-3 text-white-50">consultoria de TI</p>
                <p class="card-text">diagnostica problemas, planeja soluções tecnológicas e orienta empresas para
                    alinhar a tecnologia aos objetivos do negócio</p>
                <div class="d-grid gap-2">
                    <a href="#" class="btn btn-success">Whatsapp</a>
                    <a href="#" class="btn btn-danger">Instagram</a>
                    <a href="#" class="btn btn-primary">Facebook</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
